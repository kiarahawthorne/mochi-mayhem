
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi: Code Tater — Apartment</title>
<style>
body {
  background: #241c30;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 12px;
}
h2 { color: #f5b4df; }
.home {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5px;
  max-width: 650px;
  margin: auto;
  background: #64456e;
  padding: 8px;
  border: 5px solid #b98ac6;
  border-radius: 12px;
}
.room {
  background: #e8d4ed;
  color: #4c3059;
  border: 3px solid #815a91;
  border-radius: 8px;
  min-height: 125px;
  padding: 8px 3px;
  box-sizing: border-box;
}
.living { grid-column: span 2; }
.bedroom { background: #efd6ed; }
.kitchen { background: #f8e4d4; }
.bathroom { background: #d7e9f2; }
.entry { background: #e9d8bb; }
</style>
</head>
<body>
<h2>🦊 Mochi's Apartment</h2>
<div class="home">
  <div class="room bedroom">🛏️ Bedroom</div>
  <div class="room living">🛋️ Living Room</div>
  <div class="room">💻 Computer Nook</div>
  <div class="room kitchen">🍳 Kitchen</div>
  <div class="room bathroom">🛁 Bathroom</div>
  <div class="room entry">🚪 Entryway</div>
</div>
<p>Home sweet home! 🥔</p>
</body>
</html>
